[package]
name = "delta_crdt_dissemination"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
log = "0.4.28"
tokio = { version = "1.47.1", features = ["full"] }
tokio-serde = { version = "0.8.0", features = ["bincode"] }
tokio-util = { version = "0.7.16", features = ["codec"] }
futures = "0.3.31"
env_logger = "0.10.2"
toml = "0.8.23"
syn = "2.0.106"
quote = "1.0.40"
inventory = "0.3.21"

[lib]
proc-macro = true

[[bin]]
name = "server"
path = "src/main.rs"