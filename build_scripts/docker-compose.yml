x-common-variables: &common-variables
  RUST_LOG: "debug"
  CONFIG_FILE: "/etc/testbed/server-config.toml"

services:
  s1:
    image: crdt-testbed
    build:
      context: ./..
      dockerfile: Dockerfile
    container_name: s1
    environment:
      <<: *common-variables
    volumes:
      - ./server-1-config.toml:/etc/testbed/server-config.toml
      - ../benchmarks/logs/local-run:/var/log/testbed
    networks:
      - servers-network
    ports:
      - "8001:8001"
  s2:
    image: crdt-testbed
    container_name: s2
    environment:
      <<: *common-variables
    volumes:
      - ./server-2-config.toml:/etc/testbed/server-config.toml
      - ../benchmarks/logs/local-run:/var/log/testbed
    networks:
      - servers-network
    ports:
      - "8002:8002"
  s3:
    image: crdt-testbed
    container_name: s3
    environment:
      <<: *common-variables
    volumes:
      - ./server-3-config.toml:/etc/testbed/server-config.toml
      - ../benchmarks/logs/local-run:/var/log/testbed
    networks:
      - servers-network
    ports:
      - "8003:8003"

networks:
  servers-network:
    driver: bridge